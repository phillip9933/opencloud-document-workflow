name: Checks and packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
      - name: Install locked tooling
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run check:types
      - run: pnpm run check:companion
      - run: pnpm run test
      - name: Install extraction tools for source tests
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils poppler-data tesseract-ocr tesseract-ocr-eng tesseract-ocr-jpn
      - run: mkdir -p coverage && pnpm run test:coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: companion-coverage
          path: coverage/companion.lcov
      - run: pnpm run test:packaging
      - run: pnpm run build
      - run: pnpm run build:draft
      - run: pnpm run sbom
      - run: python3 scripts/notices.py
      - run: pnpm run package
      - run: pnpm run package:draft
      - run: pnpm run package:installer
      - run: python3 scripts/validate_release.py
      - name: Build matching companion image
        run: docker build --build-arg "WORKFLOW_VERSION=$(node -p 'require("./package.json").version')" -f deploy/container/Dockerfile -t document-workflow-ci:latest .
      - name: Check bundled runtime without network access
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m --entrypoint /bin/sh \
            document-workflow-ci:latest -ec '
              cd /app/source
              node --test --experimental-test-isolation=none tests/companion/*.test.mjs
              node --test --experimental-test-isolation=none tests/packaging/*.test.mjs
              pdftotext tests/fixtures/english.pdf /tmp/fixture.txt
              grep -F SYNTHETIC /tmp/fixture.txt
              tesseract --list-langs >/tmp/languages.txt
              grep -x eng /tmp/languages.txt
              grep -x jpn /tmp/languages.txt
            '
      - name: Fresh OpenCloud 9 and Caddy installation acceptance
        run: |
          docker pull opencloudeu/opencloud-rolling:9.0.0
          workflow_beta_version=$(node -p 'require("./package.json").version')
          workflow_beta_release="$PWD/artifacts/releases/$workflow_beta_version"
          workflow_beta_kit="$workflow_beta_release/document-workflow-$workflow_beta_version-install.tar.gz"
          workflow_beta_sha=$(sha256sum "$workflow_beta_kit" | cut -d ' ' -f 1)
          sudo bash scripts/accept_fresh_install.sh "$workflow_beta_kit" "$workflow_beta_sha" "$RUNNER_TEMP/document-workflow-fresh"
          sudo cat "$RUNNER_TEMP/document-workflow-fresh/RESULT.txt" > "$workflow_beta_release/INSTALL-ACCEPTANCE.txt"
          sudo cat "$RUNNER_TEMP/document-workflow-fresh/image-ids.txt" > "$workflow_beta_release/IMAGE-IDS.txt"
          cd "$workflow_beta_release"
          sha256sum INSTALL-ACCEPTANCE.txt IMAGE-IDS.txt >> SHA256SUMS
      - name: Upgrade acceptance from published 0.20.1
        run: |
          workflow_beta_version=$(node -p 'require("./package.json").version')
          workflow_beta_release="$PWD/artifacts/releases/$workflow_beta_version"
          workflow_beta_kit="$workflow_beta_release/document-workflow-$workflow_beta_version-install.tar.gz"
          workflow_beta_sha=$(sha256sum "$workflow_beta_kit" | cut -d ' ' -f 1)
          workflow_previous_kit="$RUNNER_TEMP/document-workflow-0.20.1-install.tar.gz"
          workflow_previous_sha=9bddc961a0e9114dd714db5fe2ef923ea4eee9ff2fe546fe10f050399c299c1b
          curl --fail --location --retry 3 --output "$workflow_previous_kit" https://github.com/phillip9933/opencloud-document-workflow/releases/download/v0.20.1/document-workflow-0.20.1-install.tar.gz
          sudo bash scripts/accept_fresh_install.sh "$workflow_previous_kit" "$workflow_previous_sha" "$RUNNER_TEMP/document-workflow-baseline" https://workflow-upgrade.test
          sudo bash scripts/accept_upgrade.sh "$RUNNER_TEMP/document-workflow-baseline" "$workflow_beta_kit" "$workflow_beta_sha" "$RUNNER_TEMP/document-workflow-upgrade" https://workflow-upgrade.test
          sudo cat "$RUNNER_TEMP/document-workflow-upgrade/RESULT.txt" > "$workflow_beta_release/UPGRADE-ACCEPTANCE.txt"
          cd "$workflow_beta_release"
          sha256sum UPGRADE-ACCEPTANCE.txt >> SHA256SUMS
      - run: python3 scripts/validate_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: document-workflow-release
          path: artifacts/releases/*/
